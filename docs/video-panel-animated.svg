<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="450" viewBox="0 0 1400 450" font-family="Inter, sans-serif" font-size="14">
  <defs>
    <linearGradient id="gradVideo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="videoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="vidArrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,5 L8,2.5 z" fill="#EC4899"/>
    </marker>
  </defs>
  <rect width="1400" height="450" fill="#0A0A0A"/>
  <rect x="20" y="20" width="1360" height="410" rx="16" fill="#111111" stroke="#1E1E1E"/>

  <text x="700" y="60" text-anchor="middle" font-weight="700" font-size="24" fill="#EC4899">Video Panel — Viewport-Aware Autoplay</text>

  <!-- VideoPanel Component -->
  <rect x="60" y="100" width="420" height="340" rx="12" fill="#1A1A1A" stroke="#EC4899" stroke-width="2"/>
  <text x="270" y="135" text-anchor="middle" font-weight="700" fill="#EC4899" font-size="18">VideoPanel.tsx</text>

  <!-- Video element -->
  <rect x="90" y="160" width="360" height="200" rx="8" fill="#0A0A0A" stroke="#333" stroke-width="2">
    <animate attributeName="stroke" values="#333;#EC4899;#8B5CF6;#EC4899" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="270" y="230" text-anchor="middle" fill="#EC4899" font-size="18" font-weight="700">▶</text>
  <text x="270" y="380" text-anchor="middle" fill="#EC4899" font-size="12" font-weight="600">Qwetu Documentary</text>
  <text x="270" y="400" text-anchor="middle" fill="#888" font-size="11">unihub-qwetu-documentary.mp4</text>

  <!-- Props panel -->
  <rect x="520" y="100" width="380" height="340" rx="12" fill="#1A1A1A" stroke="#8B5CF6" stroke-width="2"/>
  <text x="710" y="135" text-anchor="middle" font-weight="700" fill="#8B5CF6" font-size="18">Props & Behavior</text>

  <rect x="540" y="155" width="340" height="42" rx="6" fill="#1A1A1A" stroke="#8B5CF6" stroke-dasharray="4,4"/>
  <text x="710" y="180" text-anchor="middle" fill="#8B5CF6" font-size="13">src</text>
  <text x="710" y="196" text-anchor="middle" fill="#888" font-size="11">unihub-qwetu-documentary.mp4</text>

  <rect x="540" y="210" width="340" height="42" rx="6" fill="#1A1A1A" stroke="#8B5CF6" stroke-dasharray="4,4"/>
  <text x="710" y="235" text-anchor="middle" fill="#8B5CF6" font-size="13">poster</text>
  <text x="710" y="251" text-anchor="middle" fill="#888" font-size="11">unihub-qwetu-poster.jpg</text>

  <rect x="540" y="265" width="340" height="42" rx="6" fill="#1A1A1A" stroke="#8B5CF6" stroke-dasharray="4,4"/>
  <text x="710" y="290" text-anchor="middle" fill="#8B5CF6" font-size="13">className</text>
  <text x="710" y="281" text-anchor="middle" fill="#888" font-size="11">scroll-reveal</text>

  <rect x="540" y="320" width="340" height="42" rx="6" fill="#1A1A1A" stroke="#8B5CF6" stroke-dasharray="4,4"/>
  <text x="710" y="345" text-anchor="middle" fill="#8B5CF6" font-size="13">delay</text>
  <text x="710" y="341" text-anchor="middle" fill="#888" font-size="11">{delay}ms transitionDelay</text>

  <rect x="540" y="375" width="340" height="42" rx="6" fill="#1A1A1A" stroke="#8B5CF6" stroke-dasharray="4,4"/>
  <text x="710" y="400" text-anchor="middle" fill="#8B5CF6" font-size="13">ref</text>
  <text x="710" y="391" text-anchor="middle" fill="#888" font-size="11">HTMLVideoElement</text>

  <!-- IntersectionObserver logic -->
  <rect x="960" y="100" width="400" height="340" rx="12" fill="#1A1A1A" stroke="#06B6D4" stroke-width="2"/>
  <text x="1160" y="135" text-anchor="middle" font-weight="700" fill="#06B6D4" font-size="18">IntersectionObserver Logic</text>

  <rect x="980" y="155" width="360" height="120" rx="8" fill="#1A1A1A" stroke="#06B6D4" stroke-dasharray="4,4"/>
  <text x="1160" y="180" text-anchor="middle" fill="#06B6D4" font-size="14" font-weight="600">IntersectionObserver</text>
  <text x="1160" y="210" text-anchor="middle" fill="#888" font-size="12">threshold: 0.25</text>
  <text x="1160" y="235" text-anchor="middle" fill="#888" font-size="11">rootMargin: "0px 0px -10% 0px"</text>
  <text x="1160" y="255" text-anchor="middle" fill="#888" font-size="11">triggers on 25% viewport entry</text>

  <rect x="980" y="290" width="360" height="120" rx="8" fill="#1A1A1A" stroke="#EC4899" stroke-dasharray="4,4"/>
  <text x="1160" y="315" text-anchor="middle" fill="#EC4899" font-size="14" font-weight="600">Playback Control</text>
  <text x="1160" y="330" text-anchor="middle" fill="#888" font-size="12">isInView && !reducedMotion</text>
  <text x="1160" y="350" text-anchor="middle" fill="#888" font-size="11">video.play() on enter</text>
  <text x="1160" y="365" text-anchor="middle" fill="#888" font-size="11">video.pause() on leave</text>
  <text x="1160" y="380" text-anchor="middle" fill="#888" font-size="11">Respects prefers-reduced-motion</text>

  <!-- Flow arrows -->
  <defs>
    <marker id="compArrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,5 L8,2.5 z" fill="#EC4899"/>
    </marker>
  </defs>

  <line x1="500" y1="135" x2="520" y2="135" stroke="#8B5CF6" stroke-width="2" marker-end="url(#flowArrow)" stroke-dasharray="8,4">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/>
  </line>

  <line x1="900" y1="135" x2="960" y2="135" stroke="#06B6D4" stroke-width="2" marker-end="url(#flowArrow)" stroke-dasharray="8,4">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- Flow legend -->
  <rect x="980" y="410" width="360" height="30" rx="6" fill="#1A1A1A" stroke="#333"/>
  <text x="1160" y="428" text-anchor="middle" fill="#888" font-size="11">VideoPanel → props → IntersectionObserver → autoplay/pause</text>

  <defs>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,5 L8,2.5 z" fill="#EC4899"/>
    </marker>
  </defs>

  <text x="700" y="435" text-anchor="middle" fill="#555" font-size="11">Scroll into view → auto-play • Scroll away → auto-pause • Respects prefers-reduced-motion</text>
</svg>