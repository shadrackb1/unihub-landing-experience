  <rect x="1070" y="440" width="260" height="52" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="1090" y="465">vite.config.ts</text>
  <text x="1090" y="482" fill="#475569" font-size="12">TanStack Start plugin + nitro</text>

  <line x1="430" y1="496" x2="1070" y2="146" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="430" y1="636" x2="590" y2="142" stroke="#334155" marker-end="url(#arrow)"/>
  <text x="470" y="630" font-size="12">mounts</text>
  <line x1="910" y1="584" x2="1070" y2="386" stroke="#334155" marker-end="url(#arrow)"/>

  <text x="1056" y="740" fill="#64748b" font-size="12">gitdiagram.com/shadrackb1/unihub-landing-experience</text>
