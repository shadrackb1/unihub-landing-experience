  <rect x="1070" y="120" width="260" height="52" rx="6" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="1090" y="145">server.ts / start.ts</text>
  <text x="1090" y="162" fill="#475569" font-size="12">SSR entry, error capture</text>
  <rect x="1070" y="200" width="260" height="52" rx="6" fill="#ffe4e6" stroke="#e11d48"/>
