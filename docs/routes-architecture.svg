  <text x="1090" y="322" fill="#475569" font-size="12">Tailwind v4 + design tokens</text>
  <rect x="1070" y="360" width="260" height="52" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="1090" y="385">routeTree.gen.ts</text>
