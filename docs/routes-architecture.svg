  <rect x="590" y="180" width="320" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="207">/listings -> ListingsPage</text>
  <rect x="590" y="240" width="320" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="267">/properties/:id -> details</text>
  <rect x="590" y="300" width="320" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="327">/hostels /hostels/:id</text>
  <rect x="590" y="360" width="320" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="387">/about /contact /privacy /terms</text>
  <rect x="590" y="440" width="320" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="610" y="467">/admin/login -> AdminLoginPage</text>
  <rect x="590" y="500" width="320" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/>
