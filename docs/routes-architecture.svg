  <text x="90" y="350">/hostels /hostels/:id /properties/:id</text>
  <text x="90" y="370" fill="#475569" font-size="12">redirect -> /app#/...</text>

  <rect x="70" y="400" width="360" height="52" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="90" y="420">/admin /admin/*</text>
  <text x="90" y="440" fill="#475569" font-size="12">redirect -> /app#/admin/*</text>

  <rect x="70" y="470" width="360" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="90" y="490">/app  -> app.tsx</text>
  <text x="90" y="510" fill="#475569" font-size="12">legacy SPA mount (client-only)</text>

  <rect x="70" y="540" width="360" height="52" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="90" y="560">/privacy /terms</text>
  <text x="90" y="580" fill="#475569" font-size="12">legal pages</text>

  <rect x="70" y="610" width="360" height="52" rx="6" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="90" y="630">__root.tsx</text>
