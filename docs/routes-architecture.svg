<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Inter, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#f5f3ff"/>

  <rect x="40" y="60" width="420" height="640" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="90" font-weight="600">TanStack Start routes (SSR)</text>

  <rect x="70" y="120" width="360" height="52" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="90" y="140">/  -> index.tsx (7-act funnel)</text>
  <text x="90" y="160" fill="#475569" font-size="12">listings via useListings(), CampusMap</text>

